# Supported upstream CPython versions — the tfs-python src release set
# (schema/versions.schema.yml).
#
# Lines: 3.11, 3.12, 3.13, 3.14. The pin follows the DEPENDENCY GRAPH, not the
# newest upstream line — the PROGRESS/25 lesson (2026-08-30): the chocolatey
# feed declared xml2rfc 3.30.2 -> python3 [3.8.0, 3.13.0), "latest python"
# resolved to an out-of-range 3.14.x, and re-resolution slid to a 3.13.0 RC
# that broke the install. The driving payload is xml2rfc: PyPI reports
# requires_python ">=3.10" for xml2rfc 3.34.0 (checked 2026-09-01), so 3.11
# through 3.14 are all in range. A release-monitor PR onboarding a NEW line
# (e.g. 3.14) must be checked against xml2rfc's requires_python before merge
# — the monitor detects, a human gates. 3.11.16 was human-gated IN by the
# owner 2026-09-05 (3.11 is security-supported until 2027-10); 3.10 stays
# out (EOL 2026-10-31); 3.15.0 stays un-onboarded until its own gate.
#
# sha256 provenance: each sum is computed from the fetched tarball AND
# cross-checked against a second official source (recorded per version):
#   3.11.16 — release .sigstore bundle's signed SHA2_256 message digest
#   3.13.15 — release .spdx.json SBOM package checksum (CPython 3.13.15)
#   3.12.14 — release .sigstore bundle's signed SHA2_256 message digest
