# patch-3.14.yaml — the 3.14 line's canonical patch set
# (schema/patches.schema.yml; applied in array order by Tfs::SourcePrep).
#
# The windows-msys port (TODO.python/05, item 1). Every entry is
# _msys-suffixed: the series applies ONLY to the windows-msys scenario
# tree — the unsuffixed linux-gnu asset stays byte-identical with the
# pristine upstream tarball. The wall evidence and per-patch rationale are
# in each patch file's header comment.
#
# Apply order follows the MSYS2 MINGW-packages numbering (the proven
# out-of-tree port this series tracks): each patch's context assumes the
# preceding ones. The one exception is the closing entry:
# configure_syslibs_msys is a tebako deviation with no MSYS2 number
# (rationale in its header), appended last. v0.3.2 extends the set past
# the PR #16 walls (sysmodule VPATH, thread_pthread) with the sweep of
# the full MSYS2 series for our build shape — the ported set and the
# deliberate skips are recorded in the PR body. v0.3.3 adds the shared
# build (0009/0010) plus the dynload_win cluster (0011-0015) that the
# PyWin_DLLhModule link wall forced — the cluster moves windows-msys
# extension modules to the .cp314-mingw_x86_64_ucrt_gnu.pyd spelling;
# see the dynload_win_msys header. The same release carries 0066 (the
# _Py_CheckPython3 declaration conflict the dynload_win.c compile
# raised) and 0039 (the wmain/-municode exe link fix + win resources +
# pythonw.exe). v0.3.3's first CI leg then exposed the interpreter boot
# wall: _bootstrap_external.py imports winreg at module top level on
# win32, and the autoconf build had never built winreg — answered by
# 0018 (winreg/msvcrt/_winapi as bootstrap-static modules). The second
# CI leg exposed the next one: site.py's win32 branch reads sys.winver,
# which upstream sysmodule.c installs only under the MSVC-project-only
# MS_COREDLL — answered by 0034 (the guard becomes
# defined(MS_WINDOWS) && defined(Py_ENABLE_SHARED)). v0.3.4 answers
# v0.3.3's third CI leg (trp run 34748169561): the shared build's
# pybuilddir.txt rule dies in sysconfig --generate-posix-vars with
# KeyError 'LIBPL' — upstream's nt path (_init_non_posix) never merges
# the Makefile-parsed build_time_vars — answered by 0020 (mingw builds
# take the posix sysconfig path) riding on 0003's sys._is_mingw flag,
# which the series previously skipped for lack of a consumer; 0034's
# hunk 3 returns to its MSYS2-verbatim (0003-carrying) context.
# v0.3.5 answers v0.3.4's windows CI leg (trp run 34750005177): the
# shared-extension links die on unresolved winsock/ole symbols — PE
# resolves every symbol at link time and upstream's PY_STDLIB_MOD
# stanzas carry no per-module libs (MSVC gets them via PCbuild) —
# answered by 0061 + 0073 (_multiprocessing: the win32 enable
# condition, then -lws2_32), 0074 (select: _MSC_VER → MS_WIN32 guards
# + -lws2_32), and 0076 (_ctypes: -lole32 -loleaut32 -luuid, the next
# wall pre-empted — _ctypes rides SHAREDMODS on the libffi-carrying
# runner and nothing in the series gates it); 0076's hunk-3 context is
# re-authored for 3.14.7's ac_cv_func_dlopen spelling.
# v0.3.6 answers v0.3.5's windows CI leg (trp run 34753278108): `make
# install` died in ensurepip — pip's vendored cachecontrol imports
# mmap, and upstream gates the module on the posix sys/mman.h probe
# (the win32 path uses MapViewOfFile) — answered by 0062. The same
# leg's extension check REMOVED three built modules
# (_decimal/_zstd/_testinternalcapi): upstream's bpo-36085
# LOAD_LIBRARY_SEARCH_DEFAULT_DIRS never searches PATH, so a
# build-tree .pyd can't see its dependency DLLs in <ucrt64>/bin —
# answered by 0067 (PYTHONLEGACYWINDOWSDLLLOADING reverts to
# LOAD_WITH_ALTERED_SEARCH_PATH; check_extension_modules.py sets it
# for its own imports). 0064 rides along (the dlopen-gated test
# modules switch to have_dynamic_loading), which restores 0076's
# hunk-3 context to MSYS2-verbatim.
#
# NEVER a jit variant on this platform: CPython's experimental JIT target
# whitelist (PEP 774's tiering, Tools/jit/_targets.py per PEP 836's
# build-story wording) admits only Tier-1 MSVC windows — a mingw/ucrt64
# jit build is rejected upstream by construction, so the -jit catalog
# flavors (tebako-runtime-python contract.yml) are never attempted here.
